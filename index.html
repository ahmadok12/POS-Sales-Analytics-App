<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Mizan Retail: mobile POS and owner sales analytics prototype for a retail kiosk in Dubai.">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Mizan Retail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: top bar with Staff/Owner switch. Staff POS = counter layout (teal sidebar, sale panel, product grid) on tablets and PCs, stacked app on phones. Owner = phone app. */
:root{
  --bg:#E9F0EF; --canvas:#F4F8F7; --surface:#FFFFFF; --surface-2:#F2F6F5; --ink:#1A2826; --muted:#667775; --line:#E0E8E6;
  --accent:#24877B; --accent-ink:#FFFFFF; --accent-soft:#DDF1EE; --side:#3A9C8F; --side-ink:#FFFFFF; --imgbg:#EFF3F3;
  --shadow:0 1px 2px rgb(20 60 55 / .05), 0 10px 26px -18px rgb(20 60 55 / .25);
  --prior:#B8862E; --good:#1C7A45; --bad:#B23E2C; --warn:#A8700C;
  --h1:#0E7A63; --h2:#B07A1E; --h3:#3756B0; --h4:#94457F; --h5:#BC5130; --h6:#2C7C93;
  --f-display:"Figtree", "Segoe UI", system-ui, sans-serif;
  --f-body:"Figtree", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1413; --canvas:#111918; --surface:#18221F; --surface-2:#1E2A27; --ink:#E5EFEC; --muted:#93A6A1; --line:#2A3835;
  --accent:#4CC2B2; --accent-ink:#06231F; --accent-soft:#173A35; --side:#153B36; --side-ink:#E5F3F0; --imgbg:#22302D;
  --shadow:0 1px 2px rgb(0 0 0 / .3), 0 10px 26px -18px rgb(0 0 0 / .6);
  --prior:#D8A558; --good:#4CC17E; --bad:#EF7A66; --warn:#E3AE4A; --h1:#4CC3A5; --h2:#E0AE5A; --h3:#8EA6F0; --h4:#D58CC3; --h5:#F08E6C; --h6:#6CC3DA; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0D1413; --canvas:#111918; --surface:#18221F; --surface-2:#1E2A27; --ink:#E5EFEC; --muted:#93A6A1; --line:#2A3835;
  --accent:#4CC2B2; --accent-ink:#06231F; --accent-soft:#173A35; --side:#153B36; --side-ink:#E5F3F0; --imgbg:#22302D;
  --shadow:0 1px 2px rgb(0 0 0 / .3), 0 10px 26px -18px rgb(0 0 0 / .6);
  --prior:#D8A558; --good:#4CC17E; --bad:#EF7A66; --warn:#E3AE4A; --h1:#4CC3A5; --h2:#E0AE5A; --h3:#8EA6F0; --h4:#D58CC3; --h5:#F08E6C; --h6:#6CC3DA; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:0 32px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.label{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:12px;max-width:1120px;margin-inline:auto;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto}
.brand b{font-family:var(--f-display);font-size:22px;font-weight:700;letter-spacing:-.02em}
.brand span{font-size:12.5px;color:var(--muted)}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:999px;font-weight:600;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.sync{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.live .dot{background:var(--good);box-shadow:0 0 0 0 var(--good);animation:pulse 2.4s infinite}
.sync.off .dot{background:var(--warn)}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in oklab,var(--good) 60%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.banner{max-width:1120px;margin:10px auto 0;padding:8px 12px;border-radius:8px;background:color-mix(in oklab,var(--warn) 14%,var(--surface));font-size:13.5px}

/* POS device */
.device{max-width:460px;margin:16px auto 0;background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:clip;display:flex;flex-direction:column;min-height:640px}
.dev-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 10px;border-bottom:1px solid var(--line);gap:10px}
.dev-head h2{font-size:18px}
.dev-head select{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:13px}
.dev-body{flex:1;padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.tabbar{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--surface-2);position:sticky;bottom:0}
.tabbar button{border:0;background:none;padding:10px 4px 12px;font-size:12px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
.tabbar button svg{width:20px;height:20px}
.tabbar button[aria-current="true"]{color:var(--accent)}

.search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:84px}
.tile:hover{border-color:var(--accent)}
.tile:disabled{opacity:.45;cursor:not-allowed}
.tile .nm{font-weight:600;font-size:13.5px;line-height:1.25}
.tile .row{display:flex;justify-content:space-between;align-items:baseline;margin-top:auto;font-size:13px}
.stk{font-size:11.5px;color:var(--muted)}
.stk.low{color:var(--warn);font-weight:600}.stk.out{color:var(--bad);font-weight:600}

.cart{border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2)}
.cart-h{display:flex;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--line)}
.line{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px dashed var(--line);font-size:13.5px}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.qty button{border:0;background:none;width:28px;height:28px;font-size:16px}
.qty span{min-width:22px;text-align:center}
.tot{padding:10px 12px;display:grid;gap:3px;font-size:13.5px}
.tot div{display:flex;justify-content:space-between}
.tot .grand{font-size:18px;font-weight:600;font-family:var(--f-display)}
.btn{border:0;border-radius:var(--r);padding:12px 16px;font-weight:600;background:var(--accent);color:var(--accent-ink)}
.btn.wide{width:100%}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.empty{padding:22px 12px;text-align:center;color:var(--muted);font-size:13.5px}

form.stack{display:grid;gap:10px}
.field{display:grid;gap:4px}
.field input,.field select{padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.list{display:grid}
.li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px;align-items:center}
.li > div:first-child{min-width:0}
.li button{background:none;border:0;text-align:left;padding:0}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line)}
.pill.ok{color:var(--good);border-color:color-mix(in oklab,var(--good) 40%,var(--line))}
.pill.low{color:var(--warn);border-color:color-mix(in oklab,var(--warn) 40%,var(--line))}
.pill.out{color:var(--bad);border-color:color-mix(in oklab,var(--bad) 40%,var(--line))}
.pill.cash{color:var(--prior)}.pill.card{color:var(--accent)}

/* sheets */
.overlay{position:fixed;inset:0;background:color-mix(in oklab,var(--ink) 45%,transparent);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:16px}
.sheet{background:var(--surface);width:100%;max-width:440px;border-radius:18px;padding:18px;display:grid;gap:14px;max-height:92vh;overflow:auto}
.sheet h3{font-size:20px}
.pay-amt{font-family:var(--f-display);font-size:34px;font-weight:700}
.quick{display:flex;flex-wrap:wrap;gap:6px}
.quick button{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:7px 12px}
.terminal{border:1px dashed var(--line);border-radius:var(--r);padding:16px;text-align:center}
.receipt{font-family:var(--f-mono);font-size:12.5px;background:#FFFEFA;color:#1A1A1A;border-radius:6px;padding:16px 14px;border:1px solid var(--line);line-height:1.5}
.receipt .c{text-align:center}.receipt .r{display:flex;justify-content:space-between;gap:8px}
.receipt hr{border:0;border-top:1px dashed #999;margin:6px 0}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 16px);transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:999px;font-size:13.5px;z-index:60;max-width:calc(100% - 32px)}

/* owner console */
.console{max-width:1120px;margin:16px auto 0;display:grid;gap:16px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:6px}
.kpi .v{font-family:var(--f-display);font-size:26px;font-weight:700;letter-spacing:-.02em}
.cmp{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--muted)}
.delta{font-weight:600;font-variant-numeric:tabular-nums}
.delta.up{color:var(--good)}.delta.down{color:var(--bad)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;min-width:0}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.panel-h h3{font-size:17px}
.cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
@media (max-width:860px){.cols{grid-template-columns:minmax(0,1fr)}}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--f-mono);font-size:10px;fill:var(--muted)}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:right;font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
.heat{display:grid;grid-template-columns:44px repeat(14,minmax(22px,1fr));gap:3px;font-size:11px;min-width:440px}
.heat div{aspect-ratio:1.4;border-radius:3px;display:flex;align-items:center;justify-content:center}
.heat .hl{background:none;justify-content:flex-start;color:var(--muted);font-family:var(--f-mono);aspect-ratio:auto}
.feed .li{animation:none}
.feed .li.fresh{animation:flash 1.6s ease-out}
@keyframes flash{from{background:var(--accent-soft)}to{background:transparent}}
.note{font-size:12.5px;color:var(--muted)}
.segsm{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.segsm button{border:0;background:var(--surface);padding:6px 10px;font-size:12.5px;font-weight:600;color:var(--muted)}
.segsm button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.segsm button+button{border-left:1px solid var(--line)}
select.sel{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.callouts{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.callout{border-left:3px solid var(--accent);padding:4px 10px}
.callout b{display:block;font-family:var(--f-display);font-size:18px}
/* ===== POS shell: phone = stacked app with bottom tabs; ≥900px = counter layout with teal sidebar ===== */
.pos{max-width:460px;margin:16px auto 0;background:var(--canvas);border:1px solid var(--line);border-radius:24px;overflow:clip;display:flex;flex-direction:column;min-height:680px}
.side{display:none}
.pmain{flex:1;display:flex;flex-direction:column;min-width:0}
.ptop{display:flex;align-items:center;gap:12px;padding:16px 16px 18px;background:var(--side);color:var(--side-ink)}
.ptop .hello{display:flex;align-items:center;gap:10px}
.ptop .mark{width:36px;height:36px;border-radius:11px;background:rgb(255 255 255 / .18);display:grid;place-items:center;flex:none}
.ptop .mark svg{width:20px;height:20px}
.ptop .hello p{display:block;font-size:12px;margin:1px 0 0;color:inherit;opacity:.85}
.ptop .shift-chip{border-color:transparent;color:var(--ink);flex:none}
.hello{flex:1;min-width:0}
.hello h2{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hello p{display:none;margin:3px 0 0;color:var(--muted);font-size:13.5px}
.ptop .sbox{display:none}
.pbody{flex:1;padding:14px;display:flex;flex-direction:column;gap:14px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.pcard.pad{padding:16px;display:flex;flex-direction:column;gap:14px}
.logo{display:flex;align-items:center;gap:10px;font:700 22px var(--f-display);letter-spacing:-.01em;padding:2px 10px 12px}
.logo svg{width:26px;height:26px}
.snav{display:grid;gap:4px}
.snav button{display:flex;align-items:center;gap:12px;border:0;background:none;color:inherit;padding:11px 12px;border-radius:12px;font-weight:600;font-size:14.5px;text-align:left}
.snav button svg{width:20px;height:20px}
.snav button:hover{background:rgb(255 255 255 / .13)}
.snav button[aria-current="true"]{background:var(--surface);color:var(--accent);box-shadow:0 6px 14px -8px rgb(0 0 0 / .35)}
.side-foot{margin-top:auto;display:grid;gap:10px}
.side-store{border:1px solid rgb(255 255 255 / .28);border-radius:14px;padding:12px;font-size:12.5px;line-height:1.45}
.side-store b{display:block;font-size:13.5px}
.staffcard{display:flex;align-items:center;gap:10px;border:1px solid rgb(255 255 255 / .28);background:rgb(255 255 255 / .1);color:inherit;border-radius:14px;padding:10px;text-align:left;width:100%}
.staffcard:hover{background:rgb(255 255 255 / .18)}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--surface);color:var(--accent);display:grid;place-items:center;font-weight:700;flex:none}
.staffcard b{display:block;font-size:13.5px}.staffcard span{font-size:12px;opacity:.88}

/* KPI cards (counter layout) */
.pkpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
@media (max-width:1180px){.pkpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pk-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;gap:12px;align-items:flex-start;box-shadow:var(--shadow);min-width:0}
.pk-ic{width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.pk-ic svg{width:22px;height:22px}
.pk-card > div{min-width:0}
.pk-l{display:block;font-size:13px;color:var(--muted);font-weight:500}
.pk-v{display:block;font:700 23px var(--f-display);margin:3px 0 2px;white-space:nowrap}
.pk-s{font-size:12px;color:var(--accent);font-weight:600}

/* sale + products */
.sellgrid{display:grid;grid-template-columns:minmax(340px,.9fr) minmax(0,1.3fr);gap:18px;align-items:start}
.salecard{display:flex;flex-direction:column;gap:12px;padding:18px;container-type:inline-size}
@media (min-width:900px){.sellgrid .salecard{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px)}}
.sc-h{display:flex;justify-content:space-between;align-items:center}
.sc-h h3{font-size:18px}
.sc-n{font-size:12.5px;color:var(--muted);font-weight:600}
.slines{display:flex;flex-direction:column}
.sline{display:grid;grid-template-columns:52px minmax(0,1fr) auto;grid-template-areas:"th nm del" "th qty tot";gap:6px 12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
@container (min-width:440px){.sline{grid-template-columns:52px minmax(0,1fr) auto 64px 30px;grid-template-areas:"th nm qty tot del"}}
.thumb{grid-area:th;width:52px;height:52px;border-radius:12px;background:var(--imgbg);display:grid;place-items:center;overflow:hidden}
.thumb svg{width:44px;height:44px}
.sl-n{grid-area:nm;min-width:0}
.sl-n b{font-size:14px;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sl-n span{font-size:12.5px;color:var(--muted)}
.sline .qty{grid-area:qty;justify-self:start}
.sl-t{grid-area:tot;font-weight:700;text-align:right}
.trash{grid-area:del;justify-self:end;border:0;background:none;color:var(--muted);width:30px;height:30px;border-radius:8px;display:grid;place-items:center}
.trash:hover{color:var(--bad);background:color-mix(in oklab,var(--bad) 10%,transparent)}
.trash svg{width:18px;height:18px}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.qty button{width:30px;height:30px;border:0;background:none;font-size:17px;color:var(--ink)}
.qty span{min-width:22px;text-align:center;font-weight:600}
.notebtn{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.notebtn svg{width:14px;height:14px}
#snote{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
.stot{display:grid;gap:7px;border-top:1px solid var(--line);padding-top:12px;font-size:14px}
.stot div{display:flex;justify-content:space-between}
.stot span{color:var(--muted)}
.stot .sgrand{margin-top:4px;align-items:baseline}
.stot .sgrand span{color:var(--ink);font-weight:700;font-size:16px}
.stot .sgrand b{font:700 27px var(--f-display);letter-spacing:-.01em}
.sbtns{display:grid;grid-template-columns:1fr 1.7fr;gap:10px}
.btn.soft{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.btn.pay{font-size:16px;padding:15px;font-weight:700}
.linkbtn{border:0;background:none;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:13px;align-self:center;padding:4px}
.prodcard{padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.pc-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pc-h .chips{flex:1;min-width:0}
.pc-h .scan{flex:none}

/* chips, search */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{border:0;background:var(--surface-2);border-radius:10px;padding:8px 14px;font-weight:600;font-size:13px;color:var(--muted);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip:hover{color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.chip .cn{font-size:11px;opacity:.75}
.searchrow{display:flex;gap:8px}
.sbox{flex:1;position:relative;min-width:0}
.sbox svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted);pointer-events:none}
.sbox input{width:100%;height:46px;padding:0 12px 0 40px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.sbox input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.scan{flex:none;width:46px;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center;color:var(--ink)}
.scan svg{width:20px;height:20px}

/* product tiles */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:12px}
.ptile{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:8px 8px 10px;text-align:left;display:flex;flex-direction:column;gap:8px;min-width:0;transition:transform .12s ease,box-shadow .15s,border-color .15s}
.ptile:hover{box-shadow:0 12px 24px -16px rgb(16 50 46 / .45);border-color:color-mix(in oklab,var(--accent) 35%,var(--line))}
.ptile:active{transform:scale(.97)}
.ptile.in{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.pimg{position:relative;aspect-ratio:1/.86;max-width:100%;border-radius:12px;background:var(--imgbg);display:grid;place-items:center;overflow:hidden}
.pimg svg.ill{width:76%;height:76%}
.pnm{font-size:13px;font-weight:600;line-height:1.28;padding-inline:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.56em}
.prow{display:flex;justify-content:space-between;align-items:center;gap:6px;padding-inline:2px}
.pr{font-size:14.5px;font-weight:700}
.plus{width:28px;height:28px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.plus svg{width:16px;height:16px;stroke-width:2.6}
.badge{position:absolute;top:6px;right:6px;min-width:26px;height:26px;padding:0 8px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:12.5px;line-height:26px;text-align:center;box-shadow:0 0 0 2px var(--surface)}
.badge.pop{animation:pop .3s ease-out}
@keyframes pop{0%{transform:scale(.5)}65%{transform:scale(1.18)}100%{transform:scale(1)}}
.low-tag,.sold-tag{position:absolute;left:6px;bottom:6px;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--surface)}
.low-tag{color:var(--warn)}.sold-tag{color:var(--bad)}
.ptile.sold{opacity:.6;cursor:not-allowed}
.ptile.sold .plus{background:var(--surface-2);color:var(--muted)}
.ptile.newp{border-style:dashed;background:var(--surface-2)}
.ptile.newp .pimg{background:var(--accent-soft);color:var(--accent)}
.ptile.newp .pimg svg{width:30px;height:30px}

/* blank sale (phone) */
.blank{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;padding:36px 12px 44px}
.blank .art{width:96px;height:96px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;position:relative}
.blank .art svg{width:42px;height:42px;stroke-width:1.6}
.blank .art::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:1.5px dashed color-mix(in oklab,var(--accent) 40%,transparent)}
.blank h3{font-size:20px;margin-top:8px}
.blank p{margin:0;color:var(--muted);max-width:30ch}
.addbig{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:14px;padding:14px 26px;background:var(--accent);color:var(--accent-ink);font:700 16px var(--f-display);margin-top:6px;box-shadow:0 10px 22px -12px var(--accent)}
.addbig svg{width:20px;height:20px}
.addbig:active{transform:scale(.97)}
.addrow{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:1.5px dashed color-mix(in oklab,var(--accent) 45%,var(--line));background:var(--surface-2);color:var(--accent);border-radius:14px;padding:12px;font-weight:700}
.addrow svg{width:18px;height:18px}

/* phone dock: sale bar + tabs */
.dock{position:sticky;bottom:0;z-index:5;background:var(--surface);padding-bottom:env(safe-area-inset-bottom,0px)}
.dock .tabbar{position:static}
.ticketbar{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line)}
.tb-add{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface-2);border-radius:14px;height:52px;font-weight:700;color:var(--ink)}
.tb-add svg{width:18px;height:18px;color:var(--accent)}
.charge{flex:none;border:0;border-radius:14px;padding:8px 18px;background:var(--accent);color:var(--accent-ink);display:flex;flex-direction:column;align-items:flex-end;line-height:1.15;min-width:150px}
.charge small{font-size:10.5px;font-weight:700;opacity:.85;text-transform:uppercase;letter-spacing:.08em}
.charge span{font:700 19px var(--f-display);font-variant-numeric:tabular-nums}

/* product picker (phone) */
.overlay.pk{padding:0;align-items:flex-end}
.sheet.picker{height:min(90vh,820px);max-height:none;max-width:460px;border-radius:22px 22px 0 0;display:flex;flex-direction:column;gap:12px;padding:10px 16px calc(14px + env(safe-area-inset-bottom,0px));overflow:hidden;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto}
.pscroll{flex:1;min-height:0;overflow-y:auto;margin-inline:-4px;padding:2px 4px 8px}
.pfoot{display:flex;gap:10px;align-items:center;border-top:1px solid var(--line);padding-top:12px}
.pfoot .pf-t{flex:1;min-width:0}
.pf-t b{display:block;font:700 18px var(--f-display);font-variant-numeric:tabular-nums}
.pf-t span{font-size:12px;color:var(--muted)}
.pfoot .btn{padding:13px 24px;border-radius:14px}
/* shift chip */
.shift-chip{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;white-space:nowrap}
.shift-chip .dot{width:8px;height:8px}
.shift-chip.on .dot{background:var(--good)}
.shift-chip.offs .dot{background:var(--bad)}
.gate{border:1px dashed var(--line);border-radius:14px;padding:18px;display:grid;gap:12px;text-align:center}
.var-ok{color:var(--good)}.var-bad{color:var(--bad)}
.panel .tot,.pcard .tot{padding:0}

/* owner app inside the phone frame */
.device .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.device .kpi{padding:12px;gap:4px;min-width:0}
.device .kpi .v{font-size:17px;white-space:nowrap}
.device .cols{grid-template-columns:minmax(0,1fr);gap:14px}
.device .panel{padding:14px 12px;gap:10px}
.device .panel-h h3{font-size:16px}
.device .callouts{grid-template-columns:repeat(3,minmax(0,1fr))}
.device .callout b{font-size:15px}
.device .heat{grid-template-columns:30px repeat(14,minmax(0,1fr));gap:2px;font-size:9px;min-width:0}
.device .cmp{flex-direction:column;gap:2px;font-size:12px}
.rowcard{display:grid;gap:3px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.rowcard .top2{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.rowcard .sub{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:12px;color:var(--muted)}
</style>

<script>
(() => {
/* ---------- constants & utils ---------- */
const VAT = 0.05, TZ = 4 * 3600e3, OPEN = 10, CLOSE = 23; // Dubai UTC+4; kiosk trades 10:00–24:00
const DEMO_PRODUCTS = [ // used only when the shared store is unreachable (offline preview)

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nf0 = new Intl.NumberFormat("en-US",{maximumFractionDigits:0});

const aed = v => "AED " + nf0.format(Math.round(v));

const dub = ts => new Date(ts + TZ);                  // read with getUTC*

const pct = (a,b) => b ? (a-b)/b*100 : null;

  return `<span class="delta ${p>=0?"up":"down"}">${p>=0?"▲":"▼"} ${Math.abs(p).toFixed(1)}%</span>`; };
const hhmm = ts => { const d = dub(ts); return String(d.getUTCHours()).padStart(2,"0")+":"+String(d.getUTCMinutes()).padStart(2,"0"); };

/* ---------- simulated history ---------- */
function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed>>>15, 1|seed); t = t + Math.imul(t ^ t>>>7, 61|t) ^ t; return ((t ^ t>>>14) >>> 0) / 4294967296; }; }
const RAMADAN = [["2024-03-11","2024-04-09"],["2025-03-01","2025-03-29"],["2026-02-18","2026-03-19"]];
const HIST = {};
function buildHistory(todayKey){
  const r = rng(140924), start = dday("2024-01-01"), end = dday(todayKey);
  const mf = [1.22,1.15,1.03,.96,.9,.76,.72,.76,.88,1.0,1.1,1.32];
  const wf = [1.16,.88,.86,.9,1.0,1.22,1.36];
  const prof = [.3,.45,.6,.72,.66,.6,.66,.82,1.0,1.15,1.2,1.06,.82,.52];
  const profW = [.22,.35,.5,.66,.7,.7,.8,.95,1.12,1.25,1.3,1.2,.98,.7];
  const profR = [.08,.12,.15,.18,.2,.22,.25,.3,.35,1.4,1.7,1.8,1.6,1.3];
  for (let d = start; d < end; d = addD(d,1)) {
    const key = dkey(d), m = d.getUTCMonth(), w = d.getUTCDay();
    const yrs = (d - start)/(365*864e5);
    const ram = RAMADAN.some(([a,b]) => key>=a && key<=b);
    const eid = RAMADAN.some(([,b]) => { const e = addD(dday(b),1); return d>=e && d<addD(e,4); });
    let rev = 5600 * (1 + .13*yrs) * mf[m] * wf[w] * (ram?.84:1) * (eid?1.45:1) * (.84 + r()*.32);
    const p = ram ? profR : (w===0||w===5||w===6) ? profW : prof;
    const sum = p.reduce((a,b)=>a+b,0), h = new Array(24).fill(0);
    p.forEach((v,i) => h[OPEN+i] = rev*v/sum*(.9+r()*.2));
    rev = h.reduce((a,b)=>a+b,0);
    const txn = Math.max(1, Math.round(rev / (108 + r()*30)));
    HIST[key] = { rev, txn, units: Math.round(txn*(1.45+r()*.3)), h };
  }
}

/* ---------- aggregation (history + live) ---------- */
let LIVE = {};
function aggregateLive(){
  LIVE = {};
  for (const s of S.sales) {
    const d = dub(s.ts), key = dkey(d), hr = d.getUTCHours();
    const L = LIVE[key] ||= { rev:0, txn:0, units:0, h:new Array(24).fill(0), cat:{} };
    L.rev += s.total; L.txn++; L.h[hr] += s.total;
    for (const it of s.items||[]) { L.units += it.qty; L.cat[it.cat||"Other"] = (L.cat[it.cat||"Other"]||0) + it.qty; }
  }
}
function day(key){
  const H = HIST[key], L = LIVE[key];
  if (!H && !L) return { rev:0, txn:0, units:0, h:new Array(24).fill(0), cat:{}, hist:false };
  const h = new Array(24).fill(0);
  for (let i=0;i<24;i++) h[i] = (H?H.h[i]:0) + (L?L.h[i]:0);
  return { rev:(H?.rev||0)+(L?.rev||0), txn:(H?.txn||0)+(L?.txn||0), units:(H?.units||0)+(L?.units||0), h, liveCat:L?.cat||{}, histUnits:H?.units||0 };
}
// sum a range of days; `cut` = {hour, frac} trims the LAST day to a time of day (like-for-like)
function period(from, to, cut){
  const o = { rev:0, txn:0, units:0, days:0 };
  for (let d = from; d <= to; d = addD(d,1)) {
    const x = day(dkey(d)); let f = 1;
    if (cut && +d === +to && x.rev > 0) {
      let part = 0; for (let i=0;i<cut.hour;i++) part += x.h[i]; part += x.h[cut.hour]*cut.frac;
      f = part / x.rev;
    }
    o.rev += x.rev*f; o.txn += x.txn*f; o.units += x.units*f; o.days++;
  }
  o.avg = o.txn ? o.rev/o.txn : 0; return o;
}
function now(){ const d = dub(Date.now()); return { d, today: dday(dkey(d)), hour: d.getUTCHours(), frac: d.getUTCMinutes()/60 }; }
const monthStart = d => new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 1));
const monthEnd = d => new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth()+1, 0));
const shiftMonth = (d,n) => { const t = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth()+n, 1)); const last = monthEnd(t).getUTCDate(); return new Date(Date.UTC(t.getUTCFullYear(), t.getUTCMonth(), Math.min(d.getUTCDate(), last))); };

/* product-level estimates: history units spread by popularity, plus exact live units */
function productShares(){
  const list=[...S.products.values()]; const tot=list.reduce((a,p)=>a+(+p.pop||1),0)||1;
  const sh={}; list.forEach(p=>sh[p.sku]=(+p.pop||1)/tot); return sh;
}
function unitsBySku(from,to){
  const sh = productShares(), out = {};
  for (let d=from; d<=to; d=addD(d,1)) { const H = HIST[dkey(d)]; if (H) for (const s in sh) out[s]=(out[s]||0)+H.units*sh[s]; }
  const a=+from, b=+addD(to,1)-1;
  for (const s of S.sales){ const t=+dub(s.ts); if (t>=a && t<=b) for (const it of s.items||[]) out[it.sku]=(out[it.sku]||0)+it.qty; }
  return out;
}
function unitsByCat(from,to){ const u=unitsBySku(from,to), out={};
  for (const [sku,v] of Object.entries(u)){ const c=S.products.get(sku)?.cat||"Other"; out[c]=(out[c]||0)+v; } return out; }

/* ---------- charts (hand-drawn SVG) ---------- */
function nice(m){ if(m<=0) return 1; const e=Math.pow(10,Math.floor(Math.log10(m))); const f=m/e; return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*e; }
function barChart({labels, a, b, bLine=false, hi=-1, fmt=k, h=200}){
  const W=380, H=h, L=36, R=6, T=10, B=24, n=labels.length;
  const max = nice(Math.max(1,...a,...(b||[]))), y = v => T + (H-T-B)*(1 - v/max);
  const cw = (W-L-R)/n, step = Math.ceil(n/7);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">`;
  for (let i=0;i<=4;i++){ const v=max*i/4, yy=y(v);
    s += `<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${yy+4}" text-anchor="end">${fmt(v)}</text>`; }
  const grouped = b && !bLine, bw = Math.max(2, cw*(grouped?.36:.64));
  a.forEach((v,i)=>{ const x = L + i*cw + (grouped ? cw/2 - bw - 1 : (cw-bw)/2);
    const op = hi===i ? .55 : 1;
    s += `<rect x="${x.toFixed(1)}" y="${y(v).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0,y(0)-y(v)).toFixed(1)}" rx="2" fill="var(--accent)" fill-opacity="${op}"><title>${esc(labels[i])}: ${fmt(v)}</title></rect>`; });
  if (grouped) b.forEach((v,i)=>{ const x = L + i*cw + cw/2 + 1;
    s += `<rect x="${x.toFixed(1)}" y="${y(v).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0,y(0)-y(v)).toFixed(1)}" rx="2" fill="var(--prior)"><title>${esc(labels[i])} prior: ${fmt(v)}</title></rect>`; });
  if (b && bLine){ const pts = b.map((v,i)=>`${(L+i*cw+cw/2).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
    s += `<polyline points="${pts}" fill="none" stroke="var(--prior)" stroke-width="2" stroke-linejoin="round"/>`;
    b.forEach((v,i)=> s += `<circle cx="${(L+i*cw+cw/2).toFixed(1)}" cy="${y(v).toFixed(1)}" r="${n>20?1.6:2.4}" fill="var(--prior)"/>`); }
  labels.forEach((l,i)=>{ if (i%step===0) s += `<text x="${(L+i*cw+cw/2).toFixed(1)}" y="${H-8}" text-anchor="middle">${esc(l)}</text>`; });
  return s + `</svg>`;
}

function openPay(){
  const t = cartTotals(); let method="cash", tendered=t.total;
  const ov = document.createElement("div"); ov.className="overlay";
  const draw = () => {
    const change = Math.max(0, tendered - t.total);
    ov.innerHTML = `<div class="sheet" role="dialog" aria-label="Take payment">
      <div class="panel-h"><h3>Take payment</h3><button class="btn ghost" data-x>Cancel</button></div>
      <div class="pay-amt num">${aed2(t.total)}</div>
      <div class="segsm" role="group"><button data-m="cash" aria-pressed="${method==="cash"}">Cash</button><button data-m="card" aria-pressed="${method==="card"}">Card</button></div>
      ${method==="cash" ? `<div class="field"><label class="label" for="tend">Cash received</label><input id="tend" type="number" step="0.5" min="0" value="${tendered}" inputmode="decimal"></div>
        <div class="quick">${[t.total,50,100,200,500].filter((v,i)=>i===0||v>t.total).map(v=>`<button data-tend="${v}">${i0(v,t.total)}</button>`).join("")}</div>
        <div class="tot" style="padding:0"><div class="grand"><span>Change due</span><span class="num">${aed2(change)}</span></div></div>
        <button class="btn wide" data-done ${tendered<t.total-0.001?"disabled":""}>Complete cash sale</button>`
      : `<div class="terminal" id="term"><b>Ask customer to tap, insert or swipe</b><div class="note">Prototype: the card terminal is simulated. In production this hands the amount to the Network International / Magnati terminal SDK.</div></div>
        <button class="btn wide" data-card>Send ${aed2(t.total)} to card terminal</button>`}
    </div>`;
  };

   <div class="panel"><div class="panel-h"><h3>Units sold by category</h3></div><span class="note">${MON[T.getUTCMonth()]} to date, compared like-for-like.</span>
     <div>${cats.map(c=>`<div class="rowcard"><div class="top2"><span>${esc(c)}</span><b class="num">${nf0.format(cm[c]||0)} units</b></div>
       <div class="sub"><span>MoM ${delta(cm[c]||0,lm[c]||0)}</span><span>YoY ${delta(cm[c]||0,ly[c]||0)}</span><span>30d vs prior ${delta(c30[c]||0,p30[c]||0)}</span></div></div>`).join("")}</div></div>
   <div class="panel"><div class="panel-h"><h3>Stock value by category</h3></div>${barChart({labels:cats.map(c=>c.slice(0,7)), a:catVal, h:190})}</div>
   <div class="panel"><div class="panel-h"><h3>Movement, last 14 days</h3></div>
     ${barChart({labels:days.map(d=>String(d.getUTCDate())), a:soldD, b:recvD, hi:13, fmt:v=>nf0.format(v)})}${legend("Units sold","Units received")}
     <p class="note">Received units come from deliveries logged on the Staff POS.</p></div>`;
}
$("#own-tabs").addEventListener("click", e=>{ const b=e.target.closest("button"); if(!b) return; S.ownTab=b.dataset.t; renderOwner(); });
$("#own-body").addEventListener("click", e=>{ const b=e.target.closest("button"); if(!b) return;
  if (b.dataset.sv){ S.salesView=b.dataset.sv; renderOwner(); } if (b.dataset.hr){ S.hoursRange=+b.dataset.hr; renderOwner(); } });
$("#own-body").addEventListener("change", e=>{ if(e.target.id==="cmpm"){ S.cmpMonth=e.target.value; renderOwner(); } });

/* ---------- mode switch ---------- */
function setMode(m){ S.mode=m; store("mz-mode",m); $("#m-pos").setAttribute("aria-pressed",m==="pos"); $("#m-owner").setAttribute("aria-pressed",m==="owner");
  $("#pos").hidden = m!=="pos"; $("#owner").hidden = m!=="owner"; renderAll(); }
$("#m-pos").onclick=()=>setMode("pos"); $("#m-owner").onclick=()=>setMode("owner");
function renderAll(){ aggregateLive(); if (S.mode==="pos") renderPos(); else renderOwner(); }

/* ---------- persistence: shared db, or local memory when unavailable ---------- */
let idc=0; function newId(){ try{ if(S.db) return S.db.collection("sales").doc().id; }catch(e){} return "L"+Date.now().toString(36)+(idc++); }
async function guard(fn){ try{ await fn(); } catch(e){ toast(e?.code==="invalid_argument"?"You have view-only access, so this wasn't saved.":"Couldn't sync. Check your connection and try again."); throw e; } }
async function saveProduct(p){ S.products.set(p.sku,p); persistLocal(); if(S.db) await guard(()=>S.db.doc("products/"+p.sku).set(p)); }
async function saveSale(s){ S.sales.unshift(s); persistLocal(); if(S.db) await guard(()=>S.db.doc("sales/"+s.id).set(s)); }
async function saveReceipt(r){ r.id=r.id||("R"+Date.now().toString(36)+(idc++)); S.receipts.unshift(r); persistLocal(); if(S.db) await guard(()=>S.db.doc("receipts/"+r.id).set(r)); }
async function saveShift(sh){ const i=S.shifts.findIndex(x=>x.id===sh.id); i>=0?S.shifts[i]=sh:S.shifts.unshift(sh); persistLocal(); if(S.db) await guard(()=>S.db.doc("shifts/"+sh.id).set(sh)); }
function setSync(state){ const el=$("#sync"); el.className="sync "+state; $("#sync-t").textContent = state==="live"?"Live sync":state==="off"?"Offline preview":"Connecting…"; }

const LS_KEY="mizan-demo-v1";
function persistLocal(){ if (S.db) return; try{ localStorage.setItem(LS_KEY, JSON.stringify({products:[...S.products.values()], sales:S.sales.slice(0,1000), receipts:S.receipts.slice(0,300), shifts:S.shifts.slice(0,100)})); }catch(e){} }
function useLocal(){
  if (S.db) return; setSync("off");
  let saved=null; try{ saved=JSON.parse(localStorage.getItem(LS_KEY)||"null"); }catch(e){}
  if (saved && Array.isArray(saved.products) && saved.products.length){
    saved.products.forEach(p=>S.products.set(p.sku,p)); S.sales=saved.sales||[]; S.receipts=saved.receipts||[]; S.shifts=saved.shifts||[];
  } else DEMO_PRODUCTS.forEach(p=>S.products.set(p.sku,{...p}));
  const b=$("#banner"); b.hidden=false;
  b.textContent = window.claude ? "Offline preview: the shared store isn't reachable in this view, so a demo catalog is loaded. Changes stay in this browser only."
    : "Demo mode: data is saved in this browser only, so Staff POS and Owner app share data on this device but don't sync to other devices.";
  renderAll();
}
async function init(){
  buildHistory(dkey(now().today));
  setMode(S.mode);
  let db=null;
  try { db = window.claude?.use ? await Promise.race([window.claude.use("db"), new Promise(r=>setTimeout(()=>r(null),6000))]) : null; } catch(e){ db=null; }
  if (!db) return useLocal();
  S.db=db; S.live=true; setSync("live");
  let firstSales=true;
  db.collection("products").onSnapshot(snap=>{ S.products=new Map(snap.docs.map(d=>[d.id,d.data()])); renderAll(); }, ()=>setSync("off"));
  db.collection("sales").orderBy("ts","desc").limit(1000).onSnapshot(snap=>{
    if (!firstSales) for (const ch of snap.docChanges()) if (ch.type==="added" && !ch.doc.metadata.hasPendingWrites && !S.sales.some(s=>s.id===ch.doc.id)) {
      S.freshIds.add(ch.doc.id); const s=ch.doc.data(); if (S.mode==="owner") toast(`New sale ${aed2(s.total)} · ${s.method==="card"?"card":"cash"} · ${s.cashier||""}`); }
    firstSales=false;
    S.sales=snap.docs.map(d=>({...d.data(), id:d.id})); renderAll(); setTimeout(()=>S.freshIds.clear(),1800);
  }, ()=>setSync("off"));
  db.collection("shifts").orderBy("start","desc").limit(100).onSnapshot(snap=>{ S.shifts=snap.docs.map(d=>({...d.data(),id:d.id})); renderAll(); }, ()=>{});
  db.collection("receipts").orderBy("ts","desc").limit(300).onSnapshot(snap=>{ S.receipts=snap.docs.map(d=>({...d.data(),id:d.id})); renderAll(); }, ()=>{});
}
setInterval(()=>{ if (S.mode==="owner" && S.ownTab==="overview") renderOwner(); }, 60000);
init();
})();
</script>
